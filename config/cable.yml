# Solid Cable on the primary database, so broadcasts from bin/jobs reach browsers served by the web process.
default: &default
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

development:
  <<: *default

test:
  adapter: test

production:
  <<: *default
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
